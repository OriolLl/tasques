<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tasques">
<meta name="theme-color" content="#FAFAF8">
<title>Tasques · Oriol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── TOKENS ─────────────────────────────────────────── */
:root {
  --bg:         #FAFAF8;
  --surface:    #FFFFFF;
  --surface2:   #F4F3F0;
  --surface3:   #ECEAE6;
  --border:     #E5E3DE;
  --border2:    #D4D1CA;
  --text:       #1C1B18;
  --text2:      #6B6760;
  --text3:      #A8A49E;
  --accent:     #E8730A;
  --accent-dk:  #C45E00;
  --accent-lt:  #FFF2E8;
  --green:      #2A7A4F;
  --green-lt:   #EAF5EF;
  --blue:       #2B5FA8;
  --blue-lt:    #EBF1FB;
  --amber:      #B86800;
  --amber-lt:   #FFF5DE;
  --red:        #C03535;
  --red-lt:     #FDEAEA;
  --r-sm:       10px;
  --r:          16px;
  --r-lg:       22px;
  --r-xl:       28px;
  --shadow-sm:  0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow:     0 4px 16px rgba(0,0,0,.08), 0 1px 4px rgba(0,0,0,.04);
  --shadow-lg:  0 12px 40px rgba(0,0,0,.12), 0 4px 12px rgba(0,0,0,.06);
  --font:       'Inter', -apple-system, sans-serif;
  --safe-b:     env(safe-area-inset-bottom, 0px);
}

/* ── RESET ───────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100%;
  height: 100dvh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
}
button { font-family: var(--font); cursor: pointer; border: none; background: none; }
input, textarea, select { font-family: var(--font); }
::-webkit-scrollbar { width: 0; height: 0; }

/* ── APP SHELL ───────────────────────────────────────── */
.app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 680px;
  margin: 0 auto;
  width: 100%;
}

/* ── TOP BAR ─────────────────────────────────────────── */
.topbar {
  flex-shrink: 0;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px 0;
  display: flex;
  flex-direction: column;
  gap: 0;
  position: sticky;
  top: 0;
  z-index: 50;
}
.topbar-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.topbar-title {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -.4px;
  color: var(--text);
}
.topbar-actions { display: flex; gap: 8px; align-items: center; }
.icon-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--surface2);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  transition: background .12s;
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
}
.icon-btn:hover, .icon-btn:active { background: var(--surface3); }
.icon-btn.primary {
  background: var(--accent);
  color: #fff;
  font-size: 20px;
  font-weight: 300;
}
.icon-btn.primary:hover, .icon-btn.primary:active { background: var(--accent-dk); }

/* Search */
.search-wrap {
  position: relative;
  margin-bottom: 12px;
}
.search-icon {
  position: absolute; left: 12px; top: 50%;
  transform: translateY(-50%);
  color: var(--text3); pointer-events: none;
  display: flex; align-items: center;
}
.search-input {
  width: 100%;
  padding: 9px 36px 9px 38px;
  background: var(--surface2);
  border: 1.5px solid transparent;
  border-radius: 12px;
  font-size: 15px;
  color: var(--text);
  outline: none;
  transition: border-color .15s, background .15s;
  -webkit-appearance: none;
}
.search-input:focus {
  background: var(--surface);
  border-color: var(--accent);
}
.search-input::placeholder { color: var(--text3); }
.search-clear {
  position: absolute; right: 10px; top: 50%;
  transform: translateY(-50%);
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--text3); color: #fff;
  font-size: 11px; display: none;
  align-items: center; justify-content: center;
}
.search-clear.vis { display: flex; }

/* Tabs */
.tabs {
  display: flex;
  gap: 0;
  overflow-x: auto;
  -ms-overflow-style: none;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab-btn {
  flex-shrink: 0;
  padding: 8px 16px;
  font-size: 14px;
  font-weight: 500;
  color: var(--text3);
  border-bottom: 2.5px solid transparent;
  transition: color .15s, border-color .15s;
  -webkit-tap-highlight-color: transparent;
  white-space: nowrap;
}
.tab-btn.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

/* ── SCROLLABLE BODY ─────────────────────────────────── */
.body {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}

/* ── VIEWS ───────────────────────────────────────────── */
.view { display: none; padding: 16px 16px calc(24px + var(--safe-b)); }
.view.active { display: block; }

/* ── FILTER PILLS ────────────────────────────────────── */
.filter-row {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 0 0 12px;
  -ms-overflow-style: none;
  scrollbar-width: none;
}
.filter-row::-webkit-scrollbar { display: none; }
.pill {
  flex-shrink: 0;
  padding: 5px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text2);
  background: var(--surface);
  border: 1.5px solid var(--border);
  transition: all .12s;
  -webkit-tap-highlight-color: transparent;
}
.pill:active { opacity: .7; }
.pill.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

/* ── TASK CARDS ──────────────────────────────────────── */
.task-list { display: flex; flex-direction: column; gap: 8px; }

.task-card {
  background: var(--surface);
  border-radius: var(--r);
  border: 1.5px solid var(--border);
  overflow: hidden;
  transition: border-color .15s, box-shadow .15s;
  -webkit-tap-highlight-color: transparent;
  display: flex;
}
.task-card:active { box-shadow: none; opacity: .95; }
.task-card.done { opacity: .45; }
.task-card.expanded { border-color: var(--border2); box-shadow: var(--shadow-sm); }

/* Color stripe on the left */
.task-stripe {
  width: 5px;
  flex-shrink: 0;
  border-radius: 0;
  /* color set inline */
}

.task-card-inner {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.task-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  cursor: pointer;
  user-select: none;
}

/* Status dot */
.status-dot {
  width: 11px; height: 11px;
  border-radius: 50%;
  flex-shrink: 0;
  border: 2px solid transparent;
}

.task-main { flex: 1; min-width: 0; }
.task-title {
  font-size: 15px;
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.35;
}
.task-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 3px;
  flex-wrap: wrap;
}
.task-meta-item {
  font-size: 12px;
  color: var(--text3);
  display: flex; align-items: center; gap: 3px;
}
.task-meta-sep { color: var(--border2); font-size: 10px; }

/* Badge */
.badge {
  display: inline-flex;
  align-items: center;
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 8px;
  white-space: nowrap;
  letter-spacing: .01em;
}
.badge-sm {
  font-size: 10px;
  padding: 1px 7px;
  border-radius: 6px;
}

/* Chevron */
.chevron {
  color: var(--text3);
  font-size: 11px;
  transition: transform .2s cubic-bezier(.4,0,.2,1);
  flex-shrink: 0;
}
.chevron.open { transform: rotate(90deg); }

/* ── TASK DETAIL (expanded) ──────────────────────────── */
.task-detail {
  display: none;
  border-top: 1px solid var(--border);
}
.task-detail.open { display: block; }

/* Desc block */
.detail-desc {
  padding: 12px 16px;
  font-size: 14px;
  color: var(--text2);
  line-height: 1.6;
  border-bottom: 1px solid var(--border);
}

/* Timeline */
.timeline {
  background: var(--surface2);
}
.tl-header-row {
  display: grid;
  grid-template-columns: 28px 1fr 100px 36px;
  padding: 7px 14px;
  border-bottom: 1px solid var(--border);
  gap: 0;
}
.tl-th {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--text3);
  padding: 0 4px;
}
.tl-event {
  display: grid;
  grid-template-columns: 28px 1fr 100px 36px;
  align-items: center;
  padding: 9px 14px;
  border-bottom: 1px solid var(--border);
  gap: 0;
  background: var(--surface);
  transition: background .1s;
}
.tl-event:last-child { border-bottom: none; }
.tl-event.ev-status { background: var(--surface2); }
.tl-event.ev-created { background: var(--green-lt); }

/* Dot with line */
.tl-dot-col {
  display: flex; flex-direction: column;
  align-items: center;
  gap: 0; position: relative;
  height: 100%;
  justify-content: center;
}
.tl-d {
  width: 9px; height: 9px;
  border-radius: 50%;
  border: 2px solid var(--bg);
  flex-shrink: 0; z-index: 1;
}
.tl-d.d-created { background: var(--green); }
.tl-d.d-status  { background: var(--text3); }
.tl-d.d-comment { background: var(--accent); }

.tl-text-col { padding: 0 6px; min-width: 0; }
.tl-text {
  font-size: 13px;
  color: var(--text);
  line-height: 1.45;
  word-break: break-word;
}
.tl-text.muted { color: var(--text3); font-style: italic; font-size: 12px; }
.tl-badge-col { padding: 0 4px; }
.tl-date-col {
  font-size: 11px; color: var(--text3);
  padding: 0 4px; text-align: right;
  white-space: nowrap;
}

/* Status arrow */
.st-arrow { color: var(--text3); margin: 0 4px; font-size: 10px; }

/* Add comment */
.add-comment {
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 12px 14px;
  display: flex;
  gap: 10px;
  align-items: flex-start;
}
.av-mini {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--accent); color: #fff;
  font-size: 10px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-top: 2px;
}
.add-comment-body { flex: 1; display: flex; flex-direction: column; gap: 8px; }
.comment-textarea {
  width: 100%;
  font-size: 14px;
  padding: 8px 12px;
  background: var(--surface2);
  border: 1.5px solid transparent;
  border-radius: 12px;
  resize: none;
  height: 44px;
  color: var(--text);
  outline: none;
  transition: height .15s, border-color .15s, background .15s;
  -webkit-appearance: none;
}
.comment-textarea:focus {
  height: 80px;
  border-color: var(--accent);
  background: var(--surface);
}
.comment-textarea::placeholder { color: var(--text3); }
.add-comment-actions {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.btn-send {
  background: var(--accent); color: #fff;
  border-radius: 10px; padding: 7px 16px;
  font-size: 13px; font-weight: 600;
  transition: background .12s; flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
}
.btn-send:active { background: var(--accent-dk); }
.status-sel-wrap { display: flex; align-items: center; gap: 5px; }
.status-sel-lbl { font-size: 12px; color: var(--text3); white-space: nowrap; }
.status-sel {
  font-size: 12px; font-family: var(--font);
  padding: 6px 8px; border-radius: 9px;
  background: var(--surface2); color: var(--text2);
  border: 1.5px solid var(--border);
  outline: none; cursor: pointer;
  -webkit-appearance: none;
  transition: border-color .12s;
}
.status-sel:focus { border-color: var(--accent); }

/* Task footer */
.task-footer {
  background: var(--surface2);
  border-top: 1px solid var(--border);
  padding: 10px 14px;
  display: flex; gap: 8px; justify-content: space-between; align-items: center;
}
.btn-edit-f {
  font-size: 13px; font-weight: 500; color: var(--text2);
  padding: 6px 14px; border-radius: 9px;
  background: var(--surface); border: 1.5px solid var(--border);
  transition: all .12s; -webkit-tap-highlight-color: transparent;
}
.btn-edit-f:active { background: var(--surface2); }
.btn-del-f {
  font-size: 13px; font-weight: 500; color: var(--red);
  padding: 6px 14px; border-radius: 9px;
  background: var(--red-lt); border: 1.5px solid transparent;
  transition: all .12s; -webkit-tap-highlight-color: transparent;
}
.btn-del-f:active { opacity: .75; }

/* ── EMPTY STATE ─────────────────────────────────────── */
.empty {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 60px 20px; gap: 10px;
  color: var(--text3); text-align: center;
}
.empty-icon { font-size: 42px; opacity: .5; line-height: 1; }
.empty-title { font-size: 16px; font-weight: 600; color: var(--text2); }
.empty-sub { font-size: 14px; line-height: 1.5; max-width: 260px; }

/* ── INDICADORS ──────────────────────────────────────── */
.kpi-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 20px;
}
.kpi-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--r);
  padding: 16px 16px 14px;
}
.kpi-label {
  font-size: 11px; font-weight: 600;
  letter-spacing: .05em; text-transform: uppercase;
  color: var(--text3); margin-bottom: 6px;
}
.kpi-value {
  font-size: 32px; font-weight: 300;
  letter-spacing: -.8px; line-height: 1;
  color: var(--text);
}
.kpi-value.acc { color: var(--accent); }
.kpi-value.grn { color: var(--green); }
.kpi-value.red { color: var(--red); }
.kpi-sub { font-size: 12px; color: var(--text3); margin-top: 4px; }

.section-title {
  font-size: 13px; font-weight: 600;
  color: var(--text2); margin-bottom: 10px;
  letter-spacing: .02em;
}

/* Donut */
.donut-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--r);
  padding: 16px;
  display: flex; align-items: center; gap: 20px;
  margin-bottom: 10px;
}
.donut-legend { display: flex; flex-direction: column; gap: 8px; flex: 1; }
.dl-item { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.dl-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.dl-name { flex: 1; color: var(--text2); }
.dl-val { font-weight: 600; color: var(--text); }
.dl-pct { font-size: 11px; color: var(--text3); margin-left: 2px; }

/* Bar chart */
.bar-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--r);
  padding: 16px;
  margin-bottom: 10px;
}
.bc-row { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }
.bc-row:last-child { margin-bottom: 0; }
.bc-lbl { font-size: 12px; color: var(--text2); width: 80px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; }
.bc-track { flex: 1; height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
.bc-fill { height: 100%; border-radius: 4px; transition: width .5s cubic-bezier(.4,0,.2,1); }
.bc-num { font-size: 12px; color: var(--text3); width: 20px; flex-shrink: 0; text-align: right; }

/* Spark */
.spark-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--r);
  padding: 16px;
  margin-bottom: 10px;
}
.spark-card svg { width: 100%; display: block; }

/* Overdue table */
.overdue-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
  margin-bottom: 20px;
}
.od-row {
  display: grid;
  grid-template-columns: 1fr 90px 36px;
  align-items: center;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  gap: 6px;
  font-size: 13px;
}
.od-row:last-child { border-bottom: none; }
.od-row.od-hd {
  background: var(--surface2);
  font-size: 10px; font-weight: 600;
  letter-spacing: .05em; text-transform: uppercase;
  color: var(--text3);
}
.od-title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.od-sub { font-size: 11px; color: var(--text3); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.od-days { font-size: 14px; font-weight: 700; color: var(--red); text-align: right; white-space: nowrap; }
.ind-empty { padding: 24px; text-align: center; color: var(--text3); font-size: 13px; }

/* ── CONFIGURACIÓ ────────────────────────────────────── */
.cfg-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
  margin-bottom: 12px;
}
.cfg-card-title {
  font-size: 13px; font-weight: 600;
  color: var(--text); padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--surface2);
  display: flex; justify-content: space-between; align-items: center;
}
.cfg-card-sub { font-size: 11px; font-weight: 400; color: var(--text3); }
.cfg-item {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 16px; border-bottom: 1px solid var(--border);
  font-size: 14px;
}
.cfg-item:last-child { border-bottom: none; }
.cfg-color { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.cfg-name { flex: 1; color: var(--text); }
.cfg-cnt { font-size: 11px; color: var(--text3); background: var(--surface2); border: 1px solid var(--border); padding: 1px 7px; border-radius: 8px; flex-shrink: 0; }
.cfg-del-btn {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--red-lt); color: var(--red);
  font-size: 14px; display: flex; align-items: center; justify-content: center;
  transition: background .12s; flex-shrink: 0;
}
.cfg-del-btn:active { background: #f5c6c6; }
/* Color picker swatch */
.cfg-color-btn {
  width: 28px; height: 28px; border-radius: 50%;
  border: 2px solid var(--border);
  cursor: pointer; flex-shrink: 0;
  position: relative; overflow: hidden;
  transition: border-color .12s;
}
.cfg-color-btn:hover { border-color: var(--border2); }
.cfg-color-btn input[type="color"] {
  position: absolute; inset: -4px;
  width: calc(100% + 8px); height: calc(100% + 8px);
  opacity: 0; cursor: pointer; border: none; padding: 0;
}
.cfg-add-row {
  display: flex; gap: 8px; padding: 10px 14px;
  border-top: 1px solid var(--border); background: var(--surface2);
}
.cfg-input {
  flex: 1; padding: 8px 12px;
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: 10px; font-size: 14px; color: var(--text);
  outline: none; transition: border-color .12s;
  -webkit-appearance: none;
}
.cfg-input:focus { border-color: var(--accent); }
.cfg-add-btn {
  background: var(--accent); color: #fff;
  border-radius: 10px; padding: 8px 16px;
  font-size: 14px; font-weight: 600;
  transition: background .12s; white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}
.cfg-add-btn:active { background: var(--accent-dk); }
.cfg-info-box {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--r);
  padding: 14px 16px;
  font-size: 13px; color: var(--text3);
  line-height: 1.65; margin-bottom: 20px;
}
.cfg-info-box strong { color: var(--text2); }

/* ── MODAL ───────────────────────────────────────────── */
.modal-bg {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.35);
  z-index: 200;
  align-items: flex-end;
  justify-content: center;
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
}
.modal-bg.open { display: flex; }
.modal {
  background: var(--surface);
  border-radius: var(--r-xl) var(--r-xl) 0 0;
  padding: 8px 20px calc(28px + var(--safe-b));
  width: 100%; max-width: 680px;
  box-shadow: var(--shadow-lg);
  max-height: 94dvh;
  overflow-y: auto;
  animation: slideUp .25s cubic-bezier(.4,0,.2,1);
}
@keyframes slideUp {
  from { transform: translateY(100%); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}
.modal-handle {
  width: 40px; height: 4px;
  background: var(--border2); border-radius: 2px;
  margin: 0 auto 20px;
}
.modal-title {
  font-size: 18px; font-weight: 700;
  letter-spacing: -.3px; color: var(--text);
  margin-bottom: 20px;
}
.field { margin-bottom: 14px; }
.field label {
  display: block; font-size: 12px; font-weight: 600;
  letter-spacing: .04em; text-transform: uppercase;
  color: var(--text3); margin-bottom: 6px;
}
.field input, .field textarea, .field select {
  width: 100%; font-family: var(--font); font-size: 16px;
  padding: 11px 14px; background: var(--surface2);
  border: 1.5px solid transparent; border-radius: 12px;
  color: var(--text); outline: none;
  transition: border-color .15s, background .15s;
  -webkit-appearance: none;
}
.field input:focus, .field textarea:focus, .field select:focus {
  background: var(--surface);
  border-color: var(--accent);
}
.field textarea { resize: none; min-height: 88px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal-actions { display: flex; gap: 10px; margin-top: 20px; }
.btn-cancel {
  flex: 1; padding: 13px;
  background: var(--surface2); border-radius: 14px;
  font-size: 16px; font-weight: 600; color: var(--text2);
  transition: background .12s; -webkit-tap-highlight-color: transparent;
}
.btn-cancel:active { background: var(--surface3); }
.btn-save {
  flex: 2; padding: 13px;
  background: var(--accent); border-radius: 14px;
  font-size: 16px; font-weight: 700; color: #fff;
  transition: background .12s; -webkit-tap-highlight-color: transparent;
}
.btn-save:active { background: var(--accent-dk); }

/* ── TOAST ───────────────────────────────────────────── */
.toast {
  position: fixed; bottom: calc(24px + var(--safe-b)); left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--text); color: #fff;
  padding: 10px 20px; border-radius: 50px;
  font-size: 14px; font-weight: 500;
  opacity: 0; transition: all .25s cubic-bezier(.4,0,.2,1);
  z-index: 999; pointer-events: none;
  white-space: nowrap;
  box-shadow: var(--shadow);
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

@keyframes spin { to { transform: rotate(360deg); display: inline-block; } }
/* ── RESPONSIVE TWEAKS ───────────────────────────────── */
@media (min-width: 500px) {
  .topbar { border-radius: 0 0 0 0; }
  .kpi-grid { grid-template-columns: repeat(3, 1fr); }
}
</style>
</head>
<body>

<div class="app">

  <!-- TOP BAR -->
  <header class="topbar">
    <div class="topbar-head">
      <div class="topbar-title" id="topbar-title">Tasques</div>
      <div class="topbar-actions">
        <span id="sync-indicator" style="font-size:13px;color:var(--text3);transition:color .3s" title="Estat de sincronització">☁</span>
        <button class="icon-btn primary" onclick="openModal()" aria-label="Nova tasca" title="Nova tasca">+</button>
      </div>
    </div>
    <div class="search-wrap">
      <span class="search-icon">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="6.5" cy="6.5" r="4.5"/><line x1="10" y1="10" x2="14" y2="14"/>
        </svg>
      </span>
      <input class="search-input" id="search-input" placeholder="Cercar tasques..." oninput="onSearch()" autocomplete="off" autocorrect="off" spellcheck="false">
      <button class="search-clear" id="search-clear" onclick="clearSearch()" aria-label="Netejar cerca">✕</button>
    </div>
    <div class="tabs">
      <button class="tab-btn active" id="tab-tasques"    onclick="switchTab('tasques')">Tasques</button>
      <button class="tab-btn"        id="tab-indicadors" onclick="switchTab('indicadors')">Indicadors</button>
      <button class="tab-btn"        id="tab-config"     onclick="switchTab('config')">Configuració</button>
    </div>
  </header>

  <!-- BODY -->
  <div class="body" id="app-body">

    <!-- ══ TASQUES ══ -->
    <div class="view active" id="view-tasques">
      <div class="filter-row" id="filter-row"></div>
      <div id="task-list"></div>
    </div>

    <!-- ══ INDICADORS ══ -->
    <div class="view" id="view-indicadors">
      <div id="ind-content"></div>
    </div>

    <!-- ══ CONFIGURACIÓ ══ -->
    <div class="view" id="view-config">
      <div class="cfg-card" id="cfg-areas-card">
        <div class="cfg-card-title">Àrees de treball <span class="cfg-card-sub" id="cfg-areas-sub"></span></div>
        <div id="cfg-areas-list"></div>
        <div class="cfg-add-row">
          <input class="cfg-input" id="cfg-area-in" placeholder="Nova àrea..." onkeydown="if(event.key==='Enter')addArea()" autocorrect="off">
          <button class="cfg-add-btn" onclick="addArea()">Afegir</button>
        </div>
      </div>
      <div class="cfg-card" id="cfg-statuses-card">
        <div class="cfg-card-title">Estats <span class="cfg-card-sub" id="cfg-statuses-sub"></span></div>
        <div id="cfg-statuses-list"></div>
        <div class="cfg-add-row">
          <input class="cfg-input" id="cfg-status-in" placeholder="Nou estat..." onkeydown="if(event.key==='Enter')addStatus()" autocorrect="off">
          <button class="cfg-add-btn" onclick="addStatus()">Afegir</button>
        </div>
      </div>
      <div class="cfg-info-box">
        <strong>Com funciona</strong><br>
        Les àrees i els estats es guarden automàticament. Si n'elimines un que tingui tasques assignades, aquelles tasques mantindran el valor anterior fins que les editis manualment.
      </div>
      <div style="display:flex;gap:8px;padding-bottom:8px">
        <button onclick="exportData()" style="flex:1;padding:12px;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;font-size:14px;font-weight:500;color:var(--text2)">↑ Exportar JSON</button>
        <button onclick="document.getElementById('import-input').click()" style="flex:1;padding:12px;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;font-size:14px;font-weight:500;color:var(--text2)">↓ Importar JSON</button>
        <input type="file" id="import-input" accept=".json" style="display:none" onchange="importData(event)">
      </div>

  </div><!-- /body -->
</div><!-- /app -->

<!-- MODAL: nova/editar tasca -->
<div class="modal-bg" id="modal-bg" onclick="handleOverlayClick(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-title">Nova tasca</div>
    <div class="field">
      <label>Títol *</label>
      <input id="f-title" type="text" placeholder="Descripció de la tasca" autocorrect="on">
    </div>
    <div class="field">
      <label>Descripció</label>
      <textarea id="f-desc" placeholder="Context, objectiu, detalls..."></textarea>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Àrea</label>
        <select id="f-area"></select>
      </div>
      <div class="field">
        <label>Estat</label>
        <select id="f-status"></select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel·lar</button>
      <button class="btn-save"   onclick="saveTask()">Guardar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ═══ DATA ══════════════════════════════════════════════ */
const DEFAULT_AREAS = [
  { name:'Gestió departament',  color:'#C04F17' },
  { name:'Projectes',           color:'#2A7A4F' },
  { name:'Coordinació interna', color:'#2B5FA8' },
  { name:'Clients / Ofertes',   color:'#8C4A00' },
  { name:'R+D / Millores',      color:'#5A3080' },
];
const DEFAULT_STATUSES = ['Pendent','En curs','En espera','Completada','Cancel·lada'];
const CLOSED_STATUSES  = new Set(['Completada','Cancel·lada']);

const STATUS_COLORS = {
  'Pendent':      { bg:'#FFF5DE', fg:'#8C5200', dot:'#C07A00' },
  'En curs':      { bg:'#FFF0EA', fg:'#B03A00', dot:'#E8500A' },
  'En espera':    { bg:'#EBF1FB', fg:'#1E4B8F', dot:'#3366CC' },
  'Completada':   { bg:'#EAF5EF', fg:'#1E6640', dot:'#2A7A4F' },
  'Cancel·lada':  { bg:'#F4F3F0', fg:'#6B6760', dot:'#A8A49E' },
};
const DEFAULT_STATUS_COLOR = { bg:'#F4F3F0', fg:'#6B6760', dot:'#A8A49E' };
const DEFAULT_AREA_COLORS = ['#C04F17','#2A7A4F','#2B5FA8','#8C4A00','#5A3080','#1A6B6B','#884400','#3A3A80'];

let tasks=[], currentFilter='Totes', editId=null, searchQuery='';
let AREAS=[...DEFAULT_AREAS.map(a=>({...a}))], STATUSES=[...DEFAULT_STATUSES];

/* ═══ GIST SYNC ═════════════════════════════════════════
   Substitueix POSA_EL_TOKEN_AQUÍ pel teu token de GitHub
   (el token ha de tenir permís "gist")
════════════════════════════════════════════════════════ */
const GIST_ID    = '3c392303fee4c72b0b3ffd174bc5e2e4';
const GIST_TOKEN = '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';
const GIST_FILE  = 'tasques-data.json';

let syncPending = false;
let syncTimer   = null;
let syncStatus  = 'idle'; // 'idle' | 'loading' | 'saving' | 'error'

function setSyncIndicator(state, msg){
  syncStatus = state;
  const el = document.getElementById('sync-indicator');
  if(!el) return;
  const icons = { idle:'☁', loading:'⟳', saving:'⟳', error:'⚠' };
  const colors = { idle:'var(--text3)', loading:'var(--accent)', saving:'var(--accent)', error:'var(--red)' };
  el.textContent = icons[state] + (msg ? ' '+msg : '');
  el.style.color = colors[state];
  el.style.animation = (state==='loading'||state==='saving') ? 'spin 1s linear infinite' : 'none';
}

async function gistLoad(){
  if(GIST_TOKEN === 'POSA_EL_TOKEN_AQUÍ') return null; // token not configured
  try {
    setSyncIndicator('loading');
    const r = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
      headers: { 'Authorization': `token ${GIST_TOKEN}`, 'Accept': 'application/vnd.github.v3+json' }
    });
    if(!r.ok) throw new Error('HTTP '+r.status);
    const data = await r.json();
    const raw = data.files?.[GIST_FILE]?.content;
    if(!raw) return null;
    setSyncIndicator('idle');
    return JSON.parse(raw);
  } catch(e) {
    setSyncIndicator('error', 'error de xarxa');
    console.error('Gist load error:', e);
    return null;
  }
}

async function gistSave(){
  if(GIST_TOKEN === 'POSA_EL_TOKEN_AQUÍ') return; // token not configured
  const payload = { tasks, areas: AREAS, statuses: STATUSES };
  try {
    setSyncIndicator('saving');
    const r = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
      method: 'PATCH',
      headers: {
        'Authorization': `token ${GIST_TOKEN}`,
        'Accept': 'application/vnd.github.v3+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ files: { [GIST_FILE]: { content: JSON.stringify(payload) } } })
    });
    if(!r.ok) throw new Error('HTTP '+r.status);
    setSyncIndicator('idle');
  } catch(e) {
    setSyncIndicator('error', 'no s\'ha pogut desar');
    console.error('Gist save error:', e);
  }
}

// Debounced save: accumulates changes and saves once after 1.5s of inactivity
function scheduleSave(){
  clearTimeout(syncTimer);
  syncTimer = setTimeout(gistSave, 1500);
}

/* ── Local cache (fallback when offline) ── */
function saveLocal(){
  try{ localStorage.setItem('sodeca_tasques_v2', JSON.stringify(tasks));       }catch(e){}
  try{ localStorage.setItem('sodeca_areas',      JSON.stringify(AREAS));       }catch(e){}
  try{ localStorage.setItem('sodeca_statuses',   JSON.stringify(STATUSES));    }catch(e){}
}
function loadLocal(){
  try{ const r=localStorage.getItem('sodeca_tasques_v2'); if(r) tasks=JSON.parse(r); }catch(e){}
  try{
    const a=localStorage.getItem('sodeca_areas');
    if(a){
      const parsed=JSON.parse(a);
      AREAS = parsed.map((item,i) =>
        typeof item === 'string'
          ? { name: item, color: DEFAULT_AREA_COLORS[i % DEFAULT_AREA_COLORS.length] }
          : item
      );
    }
  }catch(e){}
  try{ const s=localStorage.getItem('sodeca_statuses'); if(s) STATUSES=JSON.parse(s); }catch(e){}
}

/* ── Main init: load from Gist, fall back to localStorage ── */
async function loadAll(){
  // Show loading state
  setSyncIndicator('loading');
  document.getElementById('task-list').innerHTML =
    '<div class="empty"><div class="empty-icon" style="font-size:28px;animation:spin 1s linear infinite">⟳</div><div class="empty-sub">Carregant dades...</div></div>';

  // First load local cache instantly so UI isn't empty
  loadLocal();
  renderAll();

  // Then try to get fresher data from Gist
  const remote = await gistLoad();
  if(remote){
    if(remote.tasks)    tasks    = remote.tasks;
    if(remote.areas)    AREAS    = remote.areas.map((item,i) =>
      typeof item === 'string'
        ? { name: item, color: DEFAULT_AREA_COLORS[i % DEFAULT_AREA_COLORS.length] }
        : item
    );
    if(remote.statuses) STATUSES = remote.statuses;
    saveLocal(); // update local cache
  }
  renderAll();
}

/* ── Unified save: local + schedule remote ── */
function save(){
  saveLocal();
  scheduleSave();
}
function saveAreas(){
  saveLocal();
  scheduleSave();
}
function saveStatuses(){
  saveLocal();
  scheduleSave();
}

/* Helper: get area color by name */
function areaColor(name){
  const a = AREAS.find(x=>x.name===name);
  return a ? a.color : DEFAULT_AREA_COLORS[0];
}

/* ── Utils ── */
function uid() { return 't'+Date.now()+Math.random().toString(36).slice(2,6); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function scol(s){ return STATUS_COLORS[s] || DEFAULT_STATUS_COLOR; }
function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('ca-ES',{day:'2-digit',month:'short'});
}
function fmtDateTime(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('ca-ES',{day:'2-digit',month:'short'})
    + ' ' + d.toLocaleTimeString('ca-ES',{hour:'2-digit',minute:'2-digit'});
}
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2200);
}

/* ═══ TAB SWITCHING ═══════════════════════════════════ */
let currentTab='tasques';
function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+tab).classList.add('active');
  // title
  const titles={tasques:'Tasques',indicadors:'Indicadors',config:'Configuració'};
  document.getElementById('topbar-title').textContent = titles[tab]||tab;
  // search only relevant on tasques
  document.querySelector('.search-wrap').style.display = tab==='tasques' ? '' : 'none';
  // render on demand
  if(tab==='indicadors') renderIndicadors();
  if(tab==='config')     renderConfig();
  // scroll to top
  document.getElementById('app-body').scrollTo(0,0);
}

/* ═══ FILTER ══════════════════════════════════════════ */
function setFilter(val){
  currentFilter=val;
  renderFilterRow();
  renderTasks();
}
function renderFilterRow(){
  const sc={};STATUSES.forEach(s=>sc[s]=0);tasks.forEach(t=>{if(t.status)sc[t.status]=(sc[t.status]||0)+1;});
  const filters=['Totes',...STATUSES];
  document.getElementById('filter-row').innerHTML = filters.map(f=>{
    const cnt = f==='Totes' ? tasks.length : (sc[f]||0);
    const isA = currentFilter===f;
    return `<button class="pill${isA?' active':''}" onclick="setFilter('${esc(f)}')">${esc(f)} <span style="opacity:.7">${cnt}</span></button>`;
  }).join('');
}

/* ═══ SEARCH ══════════════════════════════════════════ */
function onSearch(){
  searchQuery = document.getElementById('search-input').value.trim().toLowerCase();
  const cl=document.getElementById('search-clear');
  searchQuery ? cl.classList.add('vis') : cl.classList.remove('vis');
  renderTasks();
}
function clearSearch(){
  searchQuery='';
  document.getElementById('search-input').value='';
  document.getElementById('search-clear').classList.remove('vis');
  renderTasks();
}

/* ═══ RENDER TASKS ════════════════════════════════════ */
function getFiltered(){
  return tasks
    .filter(t => currentFilter==='Totes' || t.status===currentFilter)
    .filter(t => {
      if(!searchQuery) return true;
      return (t.title||'').toLowerCase().includes(searchQuery)
          || (t.desc||'').toLowerCase().includes(searchQuery)
          || (t.area||'').toLowerCase().includes(searchQuery);
    })
    .sort((a,b)=>{
      const order={};STATUSES.forEach((s,i)=>order[s]=i);
      const od=(order[a.status]??9)-(order[b.status]??9);
      return od!==0 ? od : new Date(b.created)-new Date(a.created);
    });
}

function renderTasks(){
  const filtered = getFiltered();
  const list = document.getElementById('task-list');
  // update topbar subtitle via filter row count
  if(!filtered.length){
    list.innerHTML = `<div class="empty">
      <div class="empty-icon">${searchQuery?'🔍':'📋'}</div>
      <div class="empty-title">${searchQuery?'Sense resultats':'Cap tasca'}</div>
      <div class="empty-sub">${searchQuery
        ?'Cap tasca coincideix amb "'+esc(searchQuery)+'"'
        :'Toca + per crear la primera tasca'}</div>
    </div>`;
    return;
  }
  list.innerHTML='';
  filtered.forEach(t => {
    const col  = scol(t.status);
    const acol = areaColor(t.area);
    const nc   = (t.history||[]).filter(h=>h.type==='comment').length;
    const done = CLOSED_STATUSES.has(t.status);
    const card = document.createElement('div');
    card.className='task-card'+(done?' done':'');
    card.id='card-'+t.id;

    card.innerHTML=
      `<div class="task-stripe" style="background:${acol}"></div>
      <div class="task-card-inner">
        <div class="task-row" onclick="toggleTask('${t.id}')">
          <div class="status-dot" style="background:${col.dot};border-color:${col.dot}20"></div>
          <div class="task-main">
            <div class="task-title">${esc(t.title)}</div>
            <div class="task-meta">
              <span class="badge badge-sm" style="background:${col.bg};color:${col.fg}">${esc(t.status)}</span>
              <span class="task-meta-sep">·</span>
              <span class="task-meta-item">${esc(t.area)}</span>
              <span class="task-meta-sep">·</span>
              <span class="task-meta-item">${fmtDate(t.created)}</span>
              ${nc?`<span class="task-meta-sep">·</span><span class="task-meta-item" style="color:var(--accent)">${nc} com.</span>`:''}
            </div>
          </div>
          <span class="chevron" id="chev-${t.id}">›</span>
        </div>
        <div class="task-detail" id="body-${t.id}">
          ${buildTimeline(t)}
          <div class="task-footer">
            <button class="btn-edit-f" onclick="openModal('${t.id}')">✎ Editar</button>
            <button class="btn-del-f"  onclick="deleteTask('${t.id}')">Eliminar</button>
          </div>
        </div>
      </div>`;
    list.appendChild(card);
  });
}

/* ═══ TIMELINE ════════════════════════════════════════ */
function buildTimeline(t){
  const hist = t.history||[];
  const items = [
    { type:'created', date:t.created,
      text: t.desc ? t.desc.slice(0,140)+(t.desc.length>140?'…':'') : 'Tasca creada sense descripció.' }
  ];
  hist.forEach(h=>items.push(h));
  items.sort((a,b)=>new Date(a.date)-new Date(b.date));

  const rows = items.map(h=>{
    let dotCls, rowCls, badgeHtml, textHtml;
    const col = scol(t.status);

    if(h.type==='created'){
      dotCls='d-created'; rowCls='ev-created';
      badgeHtml=`<span class="badge badge-sm" style="background:#EAF5EF;color:#1E6640">Creada</span>`;
      textHtml=`<span class="tl-text muted">${esc(h.text)}</span>`;
    } else if(h.type==='status'){
      dotCls='d-status'; rowCls='ev-status';
      const fc=scol(h.from), tc=scol(h.to);
      badgeHtml=`<span class="badge badge-sm" style="background:${tc.bg};color:${tc.fg}">${esc(h.to)}</span>`;
      textHtml=`<span class="tl-text" style="font-size:12px;color:var(--text3)">
        <span style="background:${fc.bg};color:${fc.fg};padding:1px 6px;border-radius:5px;font-size:10px;font-weight:600">${esc(h.from)}</span>
        <span class="st-arrow">→</span>
        <span style="background:${tc.bg};color:${tc.fg};padding:1px 6px;border-radius:5px;font-size:10px;font-weight:600">${esc(h.to)}</span>
      </span>`;
    } else {
      dotCls='d-comment'; rowCls='';
      badgeHtml=`<span class="badge badge-sm" style="background:${col.bg};color:${col.fg}">${esc(t.status)}</span>`;
      textHtml=`<span class="tl-text">${esc(h.text).replace(/\n/g,'<br>')}</span>`;
    }

    return `<div class="tl-event ${rowCls}">
      <div class="tl-dot-col"><div class="tl-d ${dotCls}"></div></div>
      <div class="tl-text-col">${textHtml}</div>
      <div class="tl-badge-col">${badgeHtml}</div>
      <div class="tl-date-col">${fmtDate(h.date)}</div>
    </div>`;
  }).join('');

  const hdr = `<div class="tl-header-row">
    <div class="tl-th"></div>
    <div class="tl-th">Activitat</div>
    <div class="tl-th">Estat</div>
    <div class="tl-th" style="text-align:right">Data</div>
  </div>`;

  const addRow = `<div class="add-comment">
    <div class="av-mini">OL</div>
    <div class="add-comment-body">
      <textarea class="comment-textarea" id="nc-${t.id}" placeholder="Escriu un comentari..."></textarea>
      <div class="add-comment-actions">
        <button class="btn-send" onclick="addComment('${t.id}')">Afegir</button>
        <div class="status-sel-wrap">
          <span class="status-sel-lbl">Estat:</span>
          <select class="status-sel" id="ns-${t.id}" onchange="changeStatus('${t.id}',this.value)">
            <option value="">—</option>
            ${STATUSES.map(s=>`<option value="${esc(s)}"${s===t.status?' disabled':''}>${esc(s)}</option>`).join('')}
          </select>
        </div>
      </div>
    </div>
  </div>`;

  return `<div class="timeline">${hdr}${rows}</div>${addRow}`;
}

/* ═══ TASK ACTIONS ════════════════════════════════════ */
function toggleTask(id){
  const body=document.getElementById('body-'+id), chev=document.getElementById('chev-'+id), card=document.getElementById('card-'+id);
  const isOpen=body.classList.contains('open');
  document.querySelectorAll('.task-detail.open').forEach(b=>b.classList.remove('open'));
  document.querySelectorAll('.chevron.open').forEach(c=>c.classList.remove('open'));
  document.querySelectorAll('.task-card.expanded').forEach(c=>c.classList.remove('expanded'));
  if(!isOpen){
    body.classList.add('open'); chev.classList.add('open');
    if(card) card.classList.add('expanded');
    // update stripe color in case it changed
    const stripe=card&&card.querySelector('.task-stripe');
    if(stripe){ const t=tasks.find(x=>x.id===id); if(t)stripe.style.background=areaColor(t.area); }
  }
}
function addComment(id){
  const t=tasks.find(x=>x.id===id), ta=document.getElementById('nc-'+id);
  const txt=(ta.value||'').trim(); if(!txt||!t) return;
  if(!t.history)t.history=[];
  t.history.push({type:'comment',text:txt,date:new Date().toISOString()});
  save();
  // rebuild inline
  const body=document.getElementById('body-'+id);
  const footer=body.querySelector('.task-footer').outerHTML;
  body.innerHTML=buildTimeline(t)+footer;
  body.classList.add('open');
  renderTasks(); // refresh meta counts
  toast('Comentari afegit');
}
function changeStatus(id,val){
  if(!val)return;
  const t=tasks.find(x=>x.id===id); if(!t)return;
  const prev=t.status;
  if(!t.history)t.history=[];
  t.history.push({type:'status',from:prev,to:val,date:new Date().toISOString()});
  t.status=val;
  if(CLOSED_STATUSES.has(val)&&!CLOSED_STATUSES.has(prev)) t.closedAt=new Date().toISOString();
  if(!CLOSED_STATUSES.has(val)) delete t.closedAt;
  save(); renderAll();
  setTimeout(()=>{
    const b=document.getElementById('body-'+id), c=document.getElementById('chev-'+id), card=document.getElementById('card-'+id);
    if(b){ b.classList.add('open'); if(c)c.classList.add('open'); if(card)card.classList.add('expanded'); }
  },20);
  toast('Estat: '+prev+' → '+val);
}
function deleteTask(id){
  if(!confirm('Vols eliminar aquesta tasca? Aquesta acció no es pot desfer.'))return;
  tasks=tasks.filter(t=>t.id!==id); save(); renderAll(); toast('Tasca eliminada');
}

/* ═══ MODAL ═══════════════════════════════════════════ */
function openModal(id){
  editId=id||null;
  document.getElementById('modal-title').textContent = id ? 'Editar tasca' : 'Nova tasca';
  const asel=document.getElementById('f-area'), ssel=document.getElementById('f-status');
  asel.innerHTML=AREAS.map(a=>`<option value="${esc(a.name)}">${esc(a.name)}</option>`).join('');
  ssel.innerHTML=STATUSES.map(s=>`<option>${esc(s)}</option>`).join('');
  if(id){
    const t=tasks.find(x=>x.id===id);
    if(t){ document.getElementById('f-title').value=t.title||''; document.getElementById('f-desc').value=t.desc||''; asel.value=t.area; ssel.value=t.status; }
  } else {
    document.getElementById('f-title').value=''; document.getElementById('f-desc').value='';
    asel.value=AREAS[0]?.name||''; ssel.value=STATUSES[0]||'';
  }
  document.getElementById('modal-bg').classList.add('open');
  setTimeout(()=>document.getElementById('f-title').focus(),300);
}
function closeModal(){ document.getElementById('modal-bg').classList.remove('open'); editId=null; }
function handleOverlayClick(e){ if(e.target===document.getElementById('modal-bg')) closeModal(); }
function saveTask(){
  const title=(document.getElementById('f-title').value||'').trim();
  if(!title){ document.getElementById('f-title').focus(); return; }
  const area=document.getElementById('f-area').value;
  const status=document.getElementById('f-status').value;
  const desc=(document.getElementById('f-desc').value||'').trim();
  if(editId){
    const t=tasks.find(x=>x.id===editId);
    if(t){
      if(t.status!==status){
        if(!t.history)t.history=[];
        t.history.push({type:'status',from:t.status,to:status,date:new Date().toISOString()});
        if(CLOSED_STATUSES.has(status)&&!CLOSED_STATUSES.has(t.status)) t.closedAt=new Date().toISOString();
        if(!CLOSED_STATUSES.has(status)) delete t.closedAt;
      }
      t.title=title; t.desc=desc; t.area=area; t.status=status;
    }
    toast('Tasca actualitzada');
  } else {
    tasks.unshift({id:uid(),title,desc,area,status,
      created:new Date().toISOString(),
      closedAt:CLOSED_STATUSES.has(status)?new Date().toISOString():undefined,
      history:[]});
    toast('Tasca creada correctament');
  }
  save(); closeModal(); renderAll();
}

/* ═══ INDICADORS ══════════════════════════════════════ */
function renderIndicadors(){
  const now=new Date();
  const closed = tasks.filter(t=>CLOSED_STATUSES.has(t.status));
  const open   = tasks.filter(t=>!CLOSED_STATUSES.has(t.status));
  const wkStart= new Date(now); wkStart.setDate(now.getDate()-now.getDay()+1); wkStart.setHours(0,0,0,0);
  const moStart= new Date(now.getFullYear(),now.getMonth(),1);
  const closedWk = closed.filter(t=>t.closedAt&&new Date(t.closedAt)>=wkStart).length;
  const closedMo = closed.filter(t=>t.closedAt&&new Date(t.closedAt)>=moStart).length;
  const withClose= closed.filter(t=>t.created&&t.closedAt);
  const avgDays  = withClose.length
    ? Math.round(withClose.reduce((s,t)=>s+(new Date(t.closedAt)-new Date(t.created))/86400000,0)/withClose.length)
    : null;

  // Monthly (6 months)
  const months=[];
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const end=new Date(d.getFullYear(),d.getMonth()+1,1);
    const lbl=d.toLocaleDateString('ca-ES',{month:'short'});
    const cr=tasks.filter(t=>t.created&&new Date(t.created)>=d&&new Date(t.created)<end).length;
    const dn=closed.filter(t=>t.closedAt&&new Date(t.closedAt)>=d&&new Date(t.closedAt)<end).length;
    months.push({lbl,cr,dn});
  }
  const maxM=Math.max(...months.map(m=>Math.max(m.cr,m.dn)),1);

  // Status distribution
  const sc={};STATUSES.forEach(s=>sc[s]=0);tasks.forEach(t=>{if(t.status)sc[t.status]=(sc[t.status]||0)+1;});
  const total=tasks.length||1;
  const donutData=STATUSES.map(s=>({s,v:sc[s]||0,col:scol(s).dot})).filter(d=>d.v>0);

  // Donut SVG
  let donutSVG='';
  if(donutData.length){
    const cx=44,cy=44,r=34,ir=20; let angle=-Math.PI/2;
    const paths=donutData.map(d=>{
      const slice=d.v/total*2*Math.PI; if(slice===0) return '';
      const x1=cx+r*Math.cos(angle),y1=cy+r*Math.sin(angle);
      angle+=slice;
      const x2=cx+r*Math.cos(angle),y2=cy+r*Math.sin(angle);
      const xi1=cx+ir*Math.cos(angle-slice),yi1=cy+ir*Math.sin(angle-slice);
      const xi2=cx+ir*Math.cos(angle),yi2=cy+ir*Math.sin(angle);
      const lg=slice>Math.PI?1:0;
      return`<path d="M${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 ${lg},1 ${x2.toFixed(1)},${y2.toFixed(1)} L${xi2.toFixed(1)},${yi2.toFixed(1)} A${ir},${ir} 0 ${lg},0 ${xi1.toFixed(1)},${yi1.toFixed(1)} Z" fill="${d.col}"/>`;
    }).join('');
    donutSVG=`<svg width="88" height="88" viewBox="0 0 88 88" style="flex-shrink:0">${paths}
      <text x="44" y="42" text-anchor="middle" font-size="16" font-weight="300" fill="#1C1B18" font-family="Inter,sans-serif">${tasks.length}</text>
      <text x="44" y="54" text-anchor="middle" font-size="8" fill="#A8A49E" font-family="Inter,sans-serif">tasques</text>
    </svg>`;
  }

  // Sparkline
  const W=320,H=56,pad=10;
  const sx=i=>pad+(i/(months.length-1||1))*(W-pad*2);
  const sy=v=>H-pad-(v/Math.max(...months.map(m=>m.dn),1))*(H-pad*2);
  const sparkPts=months.map((m,i)=>({x:sx(i),y:sy(m.dn),v:m.dn}));
  const linePath='M'+sparkPts.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' L');
  const areaPath=linePath+` L${sx(months.length-1).toFixed(1)},${H-pad} L${pad},${H-pad} Z`;

  // Overdue
  const longRun=open.filter(t=>t.created&&(now-new Date(t.created))>7*86400000)
    .sort((a,b)=>new Date(a.created)-new Date(b.created));

  // Bar chart per area
  const ac={};AREAS.forEach(a=>ac[a.name]=0);tasks.forEach(t=>{if(t.area)ac[t.area]=(ac[t.area]||0)+1;});
  const maxA=Math.max(...Object.values(ac),1);

  document.getElementById('ind-content').innerHTML=`
    <div class="kpi-grid">
      ${kpi('Total',tasks.length,'tasques','')}
      ${kpi('Obertes',open.length,'pendents','red')}
      ${kpi('Tancades (mes)',closedMo,'completades','acc')}
      ${kpi('Tancades (setmana)',closedWk,'des del dilluns','grn')}
      ${kpi('Temps mitjà',avgDays!==null?avgDays+'d':'—',avgDays!==null?'per tancar':'sense dades','')}
    </div>

    <div class="section-title">Distribució per estat</div>
    <div class="donut-card">
      ${donutSVG}
      <div class="donut-legend">
        ${donutData.map(d=>`<div class="dl-item">
          <div class="dl-dot" style="background:${d.col}"></div>
          <span class="dl-name">${esc(d.s)}</span>
          <span class="dl-val">${d.v}</span>
          <span class="dl-pct">${Math.round(d.v/total*100)}%</span>
        </div>`).join('')}
      </div>
    </div>

    <div class="section-title">Evolució de tancament (6 mesos)</div>
    <div class="spark-card">
      <svg height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;overflow:visible">
        <defs>
          <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#E8730A" stop-opacity=".18"/>
            <stop offset="100%" stop-color="#E8730A" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <path d="${areaPath}" fill="url(#sg)"/>
        <path d="${linePath}" fill="none" stroke="#E8730A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        ${sparkPts.map(p=>`
          <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="#E8730A" stroke="#fff" stroke-width="1.5"/>
          ${p.v>0?`<text x="${p.x.toFixed(1)}" y="${(p.y-8).toFixed(1)}" text-anchor="middle" font-size="9" fill="#6B6760" font-family="Inter,sans-serif">${p.v}</text>`:''}
        `).join('')}
        ${months.map((m,i)=>`<text x="${sx(i).toFixed(1)}" y="${H}" text-anchor="middle" font-size="9" fill="#A8A49E" font-family="Inter,sans-serif">${m.lbl}</text>`).join('')}
      </svg>
    </div>

    <div class="section-title">Per àrea</div>
    <div class="bar-card">
      ${AREAS.map(a=>{
        const v=ac[a.name]||0, pct=(v/maxA*100).toFixed(1);
        return`<div class="bc-row">
          <div class="bc-lbl" title="${esc(a.name)}">${esc(a.name)}</div>
          <div class="bc-track"><div class="bc-fill" style="width:${pct}%;background:${a.color}"></div></div>
          <div class="bc-num">${v}</div>
        </div>`;
      }).join('')}
    </div>

    <div class="section-title">Obertes sense tancar (>7 dies)</div>
    <div class="overdue-card">
      ${longRun.length===0
        ? '<div class="ind-empty">✓ Cap tasca de llarga durada. Bon ritme!</div>'
        : `<div class="od-row od-hd"><div>Títol</div><div>Estat</div><div style="text-align:right">Dies</div></div>`+
          longRun.map(t=>{
            const days=Math.floor((now-new Date(t.created))/86400000);
            const col=scol(t.status);
            return`<div class="od-row">
              <div><div class="od-title">${esc(t.title)}</div><div class="od-sub">${esc(t.area)}</div></div>
              <div><span class="badge badge-sm" style="background:${col.bg};color:${col.fg}">${esc(t.status)}</span></div>
              <div class="od-days">${days}d</div>
            </div>`;
          }).join('')
      }
    </div>
  `;
}
function kpi(lbl,val,sub,cls){
  return`<div class="kpi-card">
    <div class="kpi-label">${lbl}</div>
    <div class="kpi-value${cls?' '+cls:''}">${val}</div>
    <div class="kpi-sub">${sub}</div>
  </div>`;
}

/* ═══ CONFIGURACIÓ ════════════════════════════════════ */
function renderConfig(){
  document.getElementById('cfg-areas-sub').textContent    = AREAS.length+' àrees';
  document.getElementById('cfg-statuses-sub').textContent = STATUSES.length+' estats';

  const al=document.getElementById('cfg-areas-list'); al.innerHTML='';
  AREAS.forEach((a,i)=>{
    const cnt=tasks.filter(t=>t.area===a.name).length;
    const row=document.createElement('div'); row.className='cfg-item';
    row.innerHTML=`
      <label class="cfg-color-btn" style="background:${a.color}" title="Canviar color">
        <input type="color" value="${a.color}" onchange="setAreaColor(${i}, this.value)">
      </label>
      <span class="cfg-name">${esc(a.name)}</span>
      <span class="cfg-cnt">${cnt}</span>
      <button class="cfg-del-btn" onclick="removeArea(${i})">✕</button>`;
    al.appendChild(row);
  });

  const sl=document.getElementById('cfg-statuses-list'); sl.innerHTML='';
  STATUSES.forEach((s,i)=>{
    const cnt=tasks.filter(t=>t.status===s).length;
    const col=scol(s).dot;
    const row=document.createElement('div'); row.className='cfg-item';
    row.innerHTML=`<span class="cfg-color" style="background:${col}"></span><span class="cfg-name">${esc(s)}</span><span class="cfg-cnt">${cnt}</span><button class="cfg-del-btn" onclick="removeStatus(${i})">✕</button>`;
    sl.appendChild(row);
  });
}
function setAreaColor(i, color){
  AREAS[i].color = color;
  saveAreas();
  renderConfig();
  renderTasks(); // refresh card stripes
  toast('Color actualitzat');
}
function addArea(){
  const inp=document.getElementById('cfg-area-in');
  const val=(inp.value||'').trim(); if(!val) return;
  if(AREAS.find(a=>a.name===val)){ toast('Aquesta àrea ja existeix'); return; }
  const color = DEFAULT_AREA_COLORS[AREAS.length % DEFAULT_AREA_COLORS.length];
  AREAS.push({name:val, color}); saveAreas(); inp.value=''; renderConfig(); renderFilterRow(); toast('Àrea afegida');
}
function removeArea(i){
  const a=AREAS[i], cnt=tasks.filter(t=>t.area===a.name).length;
  if(cnt>0&&!confirm(`Aquesta àrea té ${cnt} tasca${cnt!==1?'es':''} assignada${cnt!==1?'es':''}. Vols eliminar-la igualment?`))return;
  AREAS.splice(i,1); saveAreas(); renderConfig(); renderFilterRow(); toast('Àrea eliminada');
}
function addStatus(){
  const inp=document.getElementById('cfg-status-in');
  const val=(inp.value||'').trim(); if(!val) return;
  if(STATUSES.includes(val)){ toast('Aquest estat ja existeix'); return; }
  STATUSES.push(val); saveStatuses(); inp.value=''; renderConfig(); renderFilterRow(); toast('Estat afegit');
}
function removeStatus(i){
  const s=STATUSES[i], cnt=tasks.filter(t=>t.status===s).length;
  if(cnt>0&&!confirm(`Aquest estat té ${cnt} tasca${cnt!==1?'es':''} assignada${cnt!==1?'es':''}. Vols eliminar-lo igualment?`))return;
  STATUSES.splice(i,1); saveStatuses(); renderConfig(); renderFilterRow(); toast('Estat eliminat');
}

/* ═══ IMPORT / EXPORT ═════════════════════════════════ */
function exportData(){
  const blob=new Blob([JSON.stringify(tasks,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download='tasques_'+new Date().toISOString().slice(0,10)+'.json'; a.click(); URL.revokeObjectURL(url);
  toast('Dades exportades');
}
function importData(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const imported=JSON.parse(ev.target.result);
      if(!Array.isArray(imported)) throw new Error();
      if(!confirm(`Vols importar ${imported.length} tasques? Les existents es mantindran.`))return;
      const existingIds=new Set(tasks.map(t=>t.id));
      const news=imported.filter(t=>!existingIds.has(t.id));
      tasks=[...news,...tasks]; save(); renderAll(); toast(news.length+' tasques importades');
    }catch{ alert("No s'ha pogut llegir el fitxer. Assegura't que és un JSON exportat des d'aquesta aplicació."); }
  };
  reader.readAsText(file); e.target.value='';
}

/* ═══ KEYBOARD ════════════════════════════════════════ */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeModal();
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&document.getElementById('modal-bg').classList.contains('open')) saveTask();
});

/* ═══ INIT ════════════════════════════════════════════ */
function renderAll(){ renderFilterRow(); renderTasks(); }
loadAll(); // async, renders twice: first from cache, then from Gist
