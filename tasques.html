// ── Parse uploaded XLSX ────────────────────────────────────────
function parseXLSX(file) {
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      try {
        const wb = XLSX.read(e.target.result, {type:'binary',cellDates:true});
        const ws = wb.Sheets[wb.SheetNames[0]];
        // raw:true + cellDates:true → dates become real JS Date objects (no formatting ambiguity)
        const raw = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, cellDates:true});

        // Helper: get a sortable timestamp from a cell value (Date obj, number, or string)
        function cellToDate(v) {
          if (!v) return null;
          if (v instanceof Date) return isNaN(v.getTime()) ? null : v;
          // Excel serial number (numeric, not a Date object)
          if (typeof v === 'number') {
            // Excel epoch: Jan 1 1900 = 1 (with Lotus bug: serial 60 = 29/2/1900 which doesn't exist)
            const d = new Date(Date.UTC(1899,11,30) + v * 86400000);
            return isNaN(d.getTime()) ? null : d;
          }
          if (typeof v === 'string') {
            // Try dd/mm/yyyy or dd/mm/yyyy hh:mm:ss (Spanish/Catalan Excel display format)
            const dmyMatch = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
            if (dmyMatch) {
              const [,dd,mm,yyyy,hh='0',mi='0',ss='0'] = dmyMatch;
              return new Date(+yyyy, +mm-1, +dd, +hh, +mi, +ss);
            }
            const d = new Date(v);
            return isNaN(d.getTime()) ? null : d;
          }
          return null;
        }
        function dateToISO(d) {
          if (!d) return '';
          const pad = n => String(n).padStart(2,'0');
          return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
        }

        // Header info — row 2 (index 1) contains metadata string
        const metaRow = raw[1] ? (raw[1][0]||'').toString() : '';
        const generatedMatch = metaRow.match(/Generat el: ([\d/]+\s[\d:]+)/);
        const genDate = generatedMatch ? generatedMatch[1] : '';
        const projectsMatch = metaRow.match(/Projectes: (\d+)/);
        const nProj = projectsMatch ? projectsMatch[1] : '';
        const weekRow = raw[0] ? (raw[0][8]||'').toString() : '';
        const meta = (weekRow?weekRow+' · ':'')+'Actualitzat: '+genDate+' · '+nProj+' projectes';

        // Data rows start at index 4 (row 5), headers at index 3 (row 4)
        const dataRows = raw.slice(4).filter(r=>r[0]&&r[0].toString().startsWith('SDOP'));

        // Group by SDOP
        const bySDOP = {};
        dataRows.forEach(r=>{
          const sdop = r[0]?.toString().trim();
          if (!sdop) return;
          const dateObj = cellToDate(r[2]);
          // total is resolved later from last Entregat event — store raw for now
          const totalRaw = r[8];
          const row = {
            sdop, nom:(r[1]||'').toString().trim(),
            dateObj,
            data: dateToISO(dateObj),
            estat:(r[3]||'').toString().trim(),
            autor:(r[4]||'').toString().trim(),
            versions:(r[7]||'').toString().trim(),
            totalRaw: totalRaw,
            resp_tec:(r[9]||'').toString().trim(),
            resp_com:(r[10]||'').toString().trim(),
            resp_exp:(r[11]||'').toString().trim(),
          };
          if (!bySDOP[sdop]) bySDOP[sdop]=[];
          bySDOP[sdop].push(row);
        });

        const TREBALLAT_SET = new Set(['En Estudi','En Espera Comercial','En Espera Cotització','Entregat','Adjudicat','Desestimat','Perdut','awaiting_resolution']);
        const PERDUT_SET = new Set(['Perdut','Desestimat']);

        const projects = Object.values(bySDOP).map(events=>{
          // Sort by real Date object timestamp — no string format ambiguity
          const sorted = events.slice().sort((a,b)=>{
            const ta = a.dateObj ? a.dateObj.getTime() : 0;
            const tb = b.dateObj ? b.dateObj.getTime() : 0;
            return ta - tb;
          });
          const cur = sorted[sorted.length-1];
          const first = sorted[0];
          const firstTime = first.dateObj ? first.dateObj.getTime() : null;
          let days_to_study=null, days_to_delivery=null, n_deliveries=0;
          sorted.forEach(ev=>{
            const t = ev.dateObj ? ev.dateObj.getTime() : null;
            if (t===null || firstTime===null) return;
            const diff = Math.round((t - firstTime) / 86400000);
            if (diff < 0) return;
            if (ev.estat==='En Estudi' && days_to_study===null) days_to_study=diff;
            if (ev.estat==='Entregat') { if (days_to_delivery===null) days_to_delivery=diff; n_deliveries++; }
          });
          // Days in queue: first En Cua → first En Estudi
          const firstCuaEv = sorted.find(ev=>ev.estat==='En Cua');
          const firstEstudiEv = sorted.find(ev=>ev.estat==='En Estudi');
          let days_in_cua = null;
          if (firstCuaEv && firstCuaEv.dateObj && firstEstudiEv && firstEstudiEv.dateObj) {
            const diff = Math.round((firstEstudiEv.dateObj.getTime()-firstCuaEv.dateObj.getTime())/86400000);
            if (diff >= 0) days_in_cua = diff;
          }

          // Use total from last Entregat event; fall back to most recent total
          function parseTotal(v) {
            if (v===null||v===undefined||v==='') return null;
            const f = parseFloat(v); return (isNaN(f)||f<=0) ? null : f;
          }
          const lastEntregat = [...sorted].reverse().find(ev=>ev.estat==='Entregat');
          const resolvedTotal = lastEntregat ? parseTotal(lastEntregat.totalRaw) : parseTotal(cur.totalRaw);
          return {
            sdop:cur.sdop, nom:cur.nom, estat:cur.estat,
            market: cur.resp_exp ? 'Export' : 'Nacional',
            resp_tec:cur.resp_tec, resp_com:cur.resp_com, resp_exp:cur.resp_exp,
            total: resolvedTotal,
            is_treballat: TREBALLAT_SET.has(cur.estat),
            is_guanyat: cur.estat==='Adjudicat',
            is_perdut: PERDUT_SET.has(cur.estat),
            days_to_study, days_to_delivery, days_in_cua, n_deliveries,
            n_events: events.length,
            entry_month: first.data ? first.data.slice(0,7) : null,
            first_date: first.data, current_date: cur.data,
            versions: cur.versions,
          };
        });

        resolve({projects, meta, rawBySDOP: bySDOP});
      } catch(err) { reject(err); }
    };
    reader.onerror = reject;
    reader.readAsBinaryString(file);
  });
}


// ── Week helpers ───────────────────────────────────────────────────
function getISOWeek(date) {
  const d = new Date(date);
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() + 4 - (d.getDay()||7));
  const y = d.getFullYear();
  const start = new Date(y,0,1);
  return { year:y, week: Math.ceil(((d-start)/86400000+1)/7) };
}
function weekCutoff(year, week) {
  const jan4 = new Date(year,0,4);
  const mon = new Date(jan4);
  mon.setDate(jan4.getDate() - (jan4.getDay()||7) + 1 + (week-1)*7);
  const sun = new Date(mon);
  sun.setDate(mon.getDate() + 6);
  sun.setHours(23,59,59,999);
  return sun;
}
function extractWeeks(rawBySDOP) {
  const seen = {};
  Object.values(rawBySDOP).forEach(evs => evs.forEach(ev => {
    if (!ev.dateObj) return;
    const {year,week} = getISOWeek(ev.dateObj);
    const key = `${year}-W${String(week).padStart(2,'0')}`;
    if (!seen[key]) seen[key] = {key, year, week, cutoff:weekCutoff(year,week), label:`S${week} · ${year}`};
  }));
  return Object.values(seen).sort((a,b)=>a.key.localeCompare(b.key));
}
function computeProjectsAtCutoff(rawBySDOP, cutoff) {
  const TREBALLAT_SET = new Set(['En Estudi','En Espera Comercial','En Espera Cotització','Entregat','Adjudicat','Desestimat','Perdut','awaiting_resolution']);
  const PERDUT_SET = new Set(['Perdut','Desestimat']);
  function parseTotal(v){if(v===null||v===undefined||v==='')return null;const f=parseFloat(v);return(isNaN(f)||f<=0)?null:f;}
  return Object.values(rawBySDOP).map(events=>{
    const filtered=events.filter(e=>e.dateObj&&e.dateObj<=cutoff);
    if(!filtered.length)return null;
    const sorted=filtered.slice().sort((a,b)=>(a.dateObj?.getTime()||0)-(b.dateObj?.getTime()||0));
    const cur=sorted[sorted.length-1], first=sorted[0];
    const firstTime=first.dateObj?first.dateObj.getTime():null;
    let days_to_study=null,days_to_delivery=null,n_deliveries=0;
    sorted.forEach(ev=>{
      const t=ev.dateObj?ev.dateObj.getTime():null;
      if(t===null||firstTime===null)return;
      const diff=Math.round((t-firstTime)/86400000);
      if(diff<0)return;
      if(ev.estat==='En Estudi'&&days_to_study===null)days_to_study=diff;
      if(ev.estat==='Entregat'){if(days_to_delivery===null)days_to_delivery=diff;n_deliveries++;}
    });
    const firstCuaEv=sorted.find(ev=>ev.estat==='En Cua');
    const firstEstudiEv=sorted.find(ev=>ev.estat==='En Estudi');
    let days_in_cua=null;
    if(firstCuaEv&&firstCuaEv.dateObj&&firstEstudiEv&&firstEstudiEv.dateObj){
      const diff=Math.round((firstEstudiEv.dateObj.getTime()-firstCuaEv.dateObj.getTime())/86400000);
      if(diff>=0)days_in_cua=diff;
    }
    const lastEntregat=[...sorted].reverse().find(ev=>ev.estat==='Entregat');
    const resolvedTotal=lastEntregat?parseTotal(lastEntregat.totalRaw):parseTotal(cur.totalRaw);
    return {
      sdop:cur.sdop,nom:cur.nom,estat:cur.estat,
      market:cur.resp_exp?'Export':'Nacional',
      resp_tec:cur.resp_tec,resp_com:cur.resp_com,resp_exp:cur.resp_exp,
      total:resolvedTotal,
      is_treballat:TREBALLAT_SET.has(cur.estat),
      is_guanyat:cur.estat==='Adjudicat',
      is_perdut:PERDUT_SET.has(cur.estat),
      days_to_study,days_to_delivery,days_in_cua,n_deliveries,
      n_events:filtered.length,
      entry_month:first.data?first.data.slice(0,7):null,
      first_date:first.data,current_date:cur.data,
      versions:cur.versions,
    };
  }).filter(Boolean);
}

let lastProjects = INITIAL_PROJECTS;
let lastMeta = null;
let lastRawBySDOP = null;
let lastWeeks = [];
let currentWeekIdx = -1;

function setupWeekNav() {
  const nav = document.getElementById('week-nav');
  const sel = document.getElementById('week-select');
  sel.innerHTML = '';
  lastWeeks.forEach((w,i)=>{
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = w.label + (i===lastWeeks.length-1?' (Actual)':'');
    sel.appendChild(opt);
  });
  currentWeekIdx = lastWeeks.length - 1;
  sel.value = currentWeekIdx;
  nav.style.display = 'flex';
  updateWeekNavBtns();
}
function updateWeekNavBtns() {
  document.getElementById('week-prev').disabled = currentWeekIdx <= 0;
  document.getElementById('week-next').disabled = currentWeekIdx >= lastWeeks.length-1;
}
function setWeek(idx) {
  if (!lastRawBySDOP || idx<0 || idx>=lastWeeks.length) return;
  currentWeekIdx = idx;
  document.getElementById('week-select').value = idx;
  updateWeekNavBtns();
  const wk = lastWeeks[idx];
  const isLatest = idx === lastWeeks.length-1;
  const projects = isLatest ? lastProjects : computeProjectsAtCutoff(lastRawBySDOP, wk.cutoff);
  const cutoffStr = wk.cutoff.toLocaleDateString('ca-ES',{day:'2-digit',month:'2-digit',year:'numeric'});
  const metaStr = isLatest
    ? lastMeta
    : `${wk.label} · Fins ${cutoffStr} · ${projects.length} projectes`;
  document.getElementById('hist-badge').style.display = isLatest ? 'none' : 'inline-flex';
  renderDashboard(projects, metaStr);
}

let kpisLoaded = false;
function initKPIsView() {
  const view = document.getElementById('view-kpis');
  if (!view || kpisLoaded) return;
  view.innerHTML = kpisContentHTML;
  kpisLoaded = true;
  setTimeout(() => {
    const fileInput = document.getElementById('file-input');
    if (fileInput) {
      fileInput.addEventListener('change', async e => {
        const file = e.target.files[0]; if (!file) return;
        try {
          const {projects, meta, rawBySDOP} = await parseXLSX(file);
          lastProjects = projects; lastMeta = meta; lastRawBySDOP = rawBySDOP;
          lastWeeks = extractWeeks(rawBySDOP);
          setupWeekNav(); renderDashboard(projects, meta);
          const b = document.getElementById('update-banner');
          b.style.display = 'block';
          b.textContent = '✓ Dades actualitzades · ' + projects.length + ' projectes · ' + lastWeeks.length + ' setmanes';
          setTimeout(() => b.style.display = 'none', 4000);
        } catch(err) { alert('Error llegint el fitxer: ' + err.message); }
        e.target.value = '';
      });
    }
    const wp=document.getElementById('week-prev'), wn=document.getElementById('week-next');
    const ws=document.getElementById('week-select'), tf=document.getElementById('tecnic-filter');
    if(wp) wp.addEventListener('click', () => setWeek(currentWeekIdx-1));
    if(wn) wn.addEventListener('click', () => setWeek(currentWeekIdx+1));
    if(ws) ws.addEventListener('change', e => setWeek(+e.target.value));
    if(tf) tf.addEventListener('change', () => {
      const sel = tf.value;
      renderTecnicSection(lastProjects, computeKPIs(lastProjects), sel);
    });
    Chart.defaults.font.family = 'Inter, system-ui, sans-serif';
    renderDashboard(INITIAL_PROJECTS, null);
  }, 50);
}

function initDesktop() {
  if (window.innerWidth < 768) return;
  if (document.getElementById('desktop-row')) return;

  const app  = document.getElementById('app');
  const tabs = document.getElementById('main-tabs');
  const body = document.getElementById('app-body');

  // Build desktop-row wrapper
  const row = document.createElement('div');
  row.id = 'desktop-row';
  row.className = 'desktop-row';

  // Build sidebar
  const sidebar = document.createElement('div');
  sidebar.id = 'desktop-sidebar';

  // Person filter at top (replaces old view-toggle)
  const personFilter = document.getElementById('sidebar-person-filter');
  if (personFilter) sidebar.appendChild(personFilter);

  // Separator
  const sep = document.createElement('div');
  sep.className = 'sidebar-sep';
  sidebar.appendChild(sep);

  // Tab buttons cloned into sidebar
  const tabBtns = tabs.querySelectorAll('.tab-btn');
  tabBtns.forEach(btn => {
    const clone = btn.cloneNode(true);
    clone.addEventListener('click', () => {
      tabs.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      sidebar.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      clone.classList.add('active');
      switchTab(btn.id.replace('tab-',''));
    });
    if (btn.classList.contains('active')) clone.classList.add('active');
    sidebar.appendChild(clone);
  });

  row.appendChild(sidebar);
  row.appendChild(body);
  app.appendChild(row);

  // Override switchTab to sync sidebar clone active states
  const origSwitchTab = switchTab;
  window.switchTab = function(tab) {
    origSwitchTab(tab);
    sidebar.querySelectorAll('.tab-btn').forEach(b => {
      b.classList.toggle('active', b.id === 'tab-'+tab ||
        b.textContent.trim() === document.getElementById('tab-'+tab)?.textContent.trim());
    });
  };
}
document.addEventListener('DOMContentLoaded', initDesktop);
window.addEventListener('resize', () => { if(window.innerWidth>=768 && !document.getElementById('desktop-row')) initDesktop(); });
